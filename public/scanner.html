  .bg-orb-1 { width: 340px; height: 340px; top: -120px; left: -110px; background: radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); animation: orb-float-1 16s ease-in-out infinite; }
  .bg-orb-2 { width: 380px; height: 380px; bottom: -160px; right: -120px; background: radial-gradient(circle, rgba(232,232,232,.12), transparent 70%); animation: orb-float-2 19s ease-in-out infinite; }
  .bg-orb-3 { width: 260px; height: 260px; top: 50%; left: 55%; background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); animation: orb-float-3 22s ease-in-out infinite; }
  @keyframes orb-float-1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(40px, 30px) scale(1.1); } }
  @keyframes orb-float-2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-35px, -30px) scale(1.08); } }
  @keyframes orb-float-3 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-25px, 35px) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .bg-orb { animation: none !important; } }

  #bg-particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-particle { position: absolute; bottom: -10px; border-radius: 50%; background: rgba(255,255,255,.3); animation: particle-rise linear infinite; }
  .bg-particle.dim { background: rgba(255,255,255,.14); }
  @keyframes particle-rise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: .5; }
    100% { transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .bg-particle { animation: none !important; display: none; } }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100dvh; }

  /* ---------- Header ---------- */
  header {
    padding: 14px 18px; background: var(--paper); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 2px 14px rgba(0,0,0,.4); z-index: 10;
    animation: dash-fade-in .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes dash-fade-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-logo img { width: 34px; height: 34px; border-radius: 50%; display: block; }
  .header-titles h1 { font-size: 14.5px; font-weight: 800; letter-spacing: -.2px; }
  .header-titles p { color: var(--muted); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.3px; margin-top: 1px; }
  .status-wrap { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; font-weight: 600; }
  #statusDot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; transition: background .25s, box-shadow .25s; }
  #statusDot.connected { background: var(--good); box-shadow: 0 0 8px rgba(232,232,232,.55); animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

  /* ---------- Teacher bar ---------- */
  .teacher-bar {
    padding: 10px 14px; background: var(--paper-soft); border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
    animation: dash-fade-in .5s .05s cubic-bezier(.16,1,.3,1) both;
  }
  .teacher-bar input {
    flex: 1; background: var(--field); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 500;
    transition: border-color .2s, box-shadow .2s;
  }
  .teacher-bar input:focus { outline: none; border-color: var(--good); box-shadow: 0 0 0 3px rgba(232,232,232,.14); }
  .done-btn {
    background: var(--field); color: var(--ink); border: 1px solid var(--line);
    padding: 9px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: all .2s;
  }
  .done-btn:hover:not(:disabled) { border-color: var(--good); color: var(--good); }
  .done-btn.done { background: rgba(232,232,232,.10); border-color: var(--good); color: var(--good); }
  .done-btn:disabled { opacity: .8; cursor: default; }

  /* ---------- Mode tabs ---------- */
  .mode-tabs {
    display: flex; background: var(--paper); border-bottom: 1px solid var(--line);
    animation: dash-fade-in .5s .1s cubic-bezier(.16,1,.3,1) both;
  }
  .mode-tab {
    flex: 1; text-align: center; padding: 11px; font-size: 12.5px; font-weight: 700;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color .2s, border-color .2s;
  }
  .mode-tab.active { color: var(--ink); border-bottom-color: var(--good); }

  /* ---------- Camera view ---------- */
  #reader-wrap {
    position: relative; flex: 1; background: #000; overflow: hidden;
  }
  #reader { width: 100%; height: 100%; }
  #reader video { object-fit: cover; width: 100% !important; height: 100% !important; }
  #reader img { display: none; }
  #reader__dashboard_section_csr { display: none !important; }
  #reader__scan_region { border: none !important; }

  /* Animated scan-frame overlay for a more professional feel */
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(78vw, 320px); height: 170px; pointer-events: none; z-index: 5;
  }
  .scan-frame .corner {
    position: absolute; width: 26px; height: 26px; border: 3px solid var(--good);
    filter: drop-shadow(0 0 6px rgba(232,232,232,.45));
  }
  .scan-frame .corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .scan-frame .corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .scan-frame .corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .scan-frame .corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
  .scan-frame .laser {
    position: absolute; left: 4%; right: 4%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--good) 20%, var(--good) 80%, transparent);
    box-shadow: 0 0 8px rgba(232,232,232,.55);
    animation: laser-sweep 2.2s ease-in-out infinite;
  }
  @keyframes laser-sweep {
    0%, 100% { top: 6%; opacity: .9; }
    50% { top: 92%; opacity: .9; }
  }
  .scan-frame.paused .laser { animation-play-state: paused; opacity: .25; }
  .scan-frame.paused .corner { border-color: var(--muted); filter: none; }

  /* Capture feedback: brief flash + expanding ripple the instant a code is detected */
  .capture-flash {
    position: absolute; inset: 0; background: rgba(255,255,255,0); pointer-events: none; z-index: 6;
  }
  .capture-flash.fire { animation: capture-flash-anim .38s ease-out; }
  @keyframes capture-flash-anim {
    0% { background: rgba(255,255,255,0); }
    12% { background: rgba(255,255,255,.55); }
    100% { background: rgba(255,255,255,0); }
  }
  .capture-ripple {
    position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
    margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9);
    pointer-events: none; z-index: 6; opacity: 0;
  }
  .capture-ripple.fire { animation: capture-ripple-anim .55s cubic-bezier(.16,1,.3,1); }
  @keyframes capture-ripple-anim {
    0% { transform: scale(0.3); opacity: .9; border-width: 3px; }
    100% { transform: scale(7); opacity: 0; border-width: 1px; }
  }

  .scan-hint {
    position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.85); font-size: 12.5px; font-weight: 600; letter-spacing: .2px;
    text-shadow: 0 1px 4px rgba(0,0,0,.9); pointer-events: none; z-index: 5;
  }

  /* ---------- Manual entry mode ---------- */
  #manualWrap {
    display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px; gap: 18px; background: var(--navy-deep);
  }
  #manualWrap.show { display: flex; animation: dash-fade-in .35s cubic-bezier(.16,1,.3,1) both; }
  #manualWrap .manual-icon { font-size: 32px; color: var(--muted); }
  #manualWrap .manual-label { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; max-width: 320px; }
  #manualAdmissionInput {
    width: 100%; max-width: 280px; background: var(--paper); border: 1px solid var(--line);
    color: var(--ink); font-size: 30px; text-align: center; letter-spacing: 8px;
    padding: 16px; border-radius: 14px; font-weight: 800; transition: border-color .2s, box-shadow .2s;
  }
  #manualAdmissionInput:focus { outline: none; border-color: var(--good); box-shadow: 0 0 0 4px rgba(232,232,232,.12); }
  #manualLookupBtn {
    width: 100%; max-width: 280px; background: var(--good); color: #0d0d0d; border: none;
    padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
    transition: transform .08s, filter .2s; letter-spacing: .2px;
  }
  #manualLookupBtn:active { transform: scale(0.97); }
  #manualLookupBtn:disabled { opacity: .55; }

  /* ---------- Bottom sheet ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,5,5,.88); backdrop-filter: blur(3px);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
    opacity: 0; transition: opacity .2s;
  }
  .overlay.show { display: flex; opacity: 1; }
  .sheet {
    width: 100%; max-width: 480px; background: var(--paper);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 22px 22px 0 0; padding: 26px 22px 30px;
    transform: translateY(40px); opacity: 0;
    animation: sheetUp .3s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes sheetUp { to { transform: translateY(0); opacity: 1; } }
  .sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 18px; }

  .student-avatar {
    width: 54px; height: 54px; border-radius: 50%; background: var(--field);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 800; color: var(--good); margin-bottom: 12px;
  }
  .student-name { font-size: 22px; font-weight: 800; margin: 0 0 3px; letter-spacing: -.3px; }
  .student-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; font-weight: 600; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .field { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .field .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .field .value { font-size: 16px; font-weight: 700; margin-top: 3px; }

  .btn-row { display: flex; gap: 10px; }
  button.verify {
    flex: 1; background: var(--good); color: #0d0d0d; border: none;
    padding: 16px; border-radius: 13px; font-size: 16px; font-weight: 800;
    cursor: pointer; transition: transform .08s, filter .15s; letter-spacing: .2px;
  }
  button.verify:active { transform: scale(0.97); }
  button.cancel {
    background: var(--field); color: var(--ink); border: 1px solid var(--line);
    padding: 16px 20px; border-radius: 13px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: border-color .2s;
  }
  button.cancel:hover { border-color: var(--muted); }

  /* Success check animation shown briefly after verifying */
  .success-check {
    position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
    background: rgba(5,5,5,.85); backdrop-filter: blur(4px);
  }
  .success-check.show { display: flex; }
  .success-check .circle {
    width: 92px; height: 92px; border-radius: 50%; background: rgba(232,232,232,.10);
    border: 2px solid var(--good); display: flex; align-items: center; justify-content: center;
    animation: check-pop .38s cubic-bezier(.16,1,.3,1) both;
  }
  .success-check .circle i { font-size: 40px; color: var(--good); }
  @keyframes check-pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%) translateY(-8px);
    background: var(--good); color: #0d0d0d; padding: 11px 20px; border-radius: 11px;
    font-weight: 800; font-size: 13.5px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .22s, transform .22s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--bad); color: #fff; }

  .error-banner {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 20;
    background: rgba(201,48,44,.95); color: #fff; padding: 11px 14px;
    border-radius: 11px; font-size: 13px; font-weight: 600; text-align: center; display: none;
    animation: dash-fade-in .25s cubic-bezier(.16,1,.3,1) both;
  }

  /* ---------- Footer credit ---------- */
  .footer-credit {
    position: absolute; bottom: 6px; right: 10px; font-size: 9.5px; color: rgba(255,255,255,.28);
    letter-spacing: .3px; z-index: 4; pointer-events: none;
  }
</style>

    <input id="manualAdmissionInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" autocomplete="off" />
    <button id="manualLookupBtn"><i class="fa-solid fa-magnifying-glass"></i> Look Up Student</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="success-check" id="successCheck">
  <div class="circle"><i class="fa-solid fa-check"></i></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="student-avatar" id="sAvatar">?</div>
    <div class="student-name" id="sName">—</div>
    <div class="student-sub" id="sAdm">Admission No: —</div>
    <div class="fields">
      <div class="field"><div class="label">Roll Number</div><div class="value" id="sRoll">—</div></div>
      <div class="field"><div class="label">Class</div><div class="value" id="sClass">—</div></div>
    </div>
    <div class="btn-row">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="verify" id="verifyBtn"><i class="fa-solid fa-check"></i>&nbsp; Verified</button>
    </div>
  </div>
</div>

<script>
const socket = io();
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
socket.on('connect', () => { statusDot.classList.add('connected'); statusText.textContent = 'Online'; });
socket.on('disconnect', () => { statusDot.classList.remove('connected'); statusText.textContent = 'Offline'; });

const teacherNameInput = document.getElementById('teacherName');
teacherNameInput.value = localStorage.getItem('teacherName') || '';
teacherNameInput.addEventListener('input', () => localStorage.setItem('teacherName', teacherNameInput.value));

// ---------- "Done for Today" ----------
const doneBtn = document.getElementById('doneForTodayBtn');

function todayLocalDateStr() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function refreshDoneButtonState() {
  const savedDate = localStorage.getItem('doneForTodayDate');
  doneBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Done for Today';
  if (savedDate === todayLocalDateStr()) {
    doneBtn.classList.add('done');
    doneBtn.disabled = true;
  } else {
    doneBtn.classList.remove('done');
    doneBtn.disabled = false;
  }
}
refreshDoneButtonState();

doneBtn.addEventListener('click', async () => {
  const name = (teacherNameInput.value || '').trim();
  if (!name) { showError('Enter your name first'); return; }

  doneBtn.disabled = true;
  doneBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
  try {
    const res = await fetch('/api/teacher-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teacher_name: name })
    });
    if (res.ok) {
      localStorage.setItem('doneForTodayDate', todayLocalDateStr());
      showToast(`Marked done for today, ${name}`);
      refreshDoneButtonState();
    } else {
      showToast('Failed to update status', true);
      refreshDoneButtonState();
    }
  } catch (e) {
    showToast('Network error — could not send', true);
    refreshDoneButtonState();
  }
});

const overlay = document.getElementById('overlay');
const toastEl = document.getElementById('toast');
const errorBanner = document.getElementById('errorBanner');
const readerWrap = document.getElementById('reader-wrap');
const manualWrap = document.getElementById('manualWrap');
const tabScan = document.getElementById('tabScan');
const tabManual = document.getElementById('tabManual');
const manualInput = document.getElementById('manualAdmissionInput');
const manualBtn = document.getElementById('manualLookupBtn');
const scanFrame = document.getElementById('scanFrame');
const successCheck = document.getElementById('successCheck');

let currentStudent = null;
let isPaused = false;
let lastCode = null;
let lastCodeTime = 0;

function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toastEl.className = 'toast', 1900);
}

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.style.display = 'block';
  setTimeout(() => errorBanner.style.display = 'none', 2000);
}

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function initials(name) {
  const parts = String(name).trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '?';
}

// ---------- Mode switching ----------
tabScan.addEventListener('click', () => {
  tabScan.classList.add('active');
  tabManual.classList.remove('active');
  readerWrap.style.display = '';
  manualWrap.classList.remove('show');
});

tabManual.addEventListener('click', () => {
  tabManual.classList.add('active');
  tabScan.classList.remove('active');
  readerWrap.style.display = 'none';
  manualWrap.classList.add('show');
  manualInput.value = '';
  manualInput.focus();
});

// ---------- Shared lookup logic ----------
async function lookupAndShow(admissionNo) {
  try {
    const res = await fetch(`/api/student/${admissionNo}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showError(err.error === 'Student not found'
        ? `No student found for code ${admissionNo}`
        : 'Lookup failed');
      return false;
    }
    const student = await res.json();
    currentStudent = student;
    document.getElementById('sAvatar').textContent = initials(student.student_name);
    document.getElementById('sName').textContent = student.student_name;
    document.getElementById('sAdm').textContent = `Admission No: ${student.admission_no}`;
    document.getElementById('sRoll').textContent = student.roll_number || '—';
    document.getElementById('sClass').textContent = student.class || '—';
    overlay.classList.add('show');
    return true;
  } catch (e) {
    showError('Network error during lookup');
    return false;
  }
}

manualBtn.addEventListener('click', async () => {
  const digits = manualInput.value.replace(/\D/g, '');
  if (!digits) { showError('Enter an admission number'); return; }
  const admissionNo = digits.padStart(4, '0').slice(-4);
  manualBtn.disabled = true;
  await lookupAndShow(admissionNo);
  manualBtn.disabled = false;
});

manualInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') manualBtn.click();
});

async function onScanSuccess(decodedText) {
  const now = Date.now();
  if (isPaused) return;
  if (decodedText === lastCode && (now - lastCodeTime) < 3000) return;
  lastCode = decodedText;
  lastCodeTime = now;

  // Instant capture feedback — fires the moment a code is recognized, before lookup even starts.
  const flashEl = document.getElementById('captureFlash');
  const rippleEl = document.getElementById('captureRipple');
  flashEl.classList.remove('fire'); void flashEl.offsetWidth; flashEl.classList.add('fire');
  rippleEl.classList.remove('fire'); void rippleEl.offsetWidth; rippleEl.classList.add('fire');

  const digitsOnly = decodedText.replace(/\D/g, '');
  const admissionNo = digitsOnly.slice(-4).padStart(4, '0');

  isPaused = true;
  scanFrame.classList.add('paused');
  vibrate(60);

  const ok = await lookupAndShow(admissionNo);
  if (!ok) { isPaused = false; scanFrame.classList.remove('paused'); }
}

function closeOverlay() {
  overlay.classList.remove('show');
  currentStudent = null;
  setTimeout(() => { isPaused = false; scanFrame.classList.remove('paused'); }, 400);
  if (tabManual.classList.contains('active')) {
    manualInput.value = '';
    manualInput.focus();
  }
}

document.getElementById('cancelBtn').addEventListener('click', closeOverlay);

document.getElementById('verifyBtn').addEventListener('click', async () => {
  if (!currentStudent) return;
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>&nbsp; Sending...';
  try {
    const res = await fetch('/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        admission_no: currentStudent.admission_no,
        scanned_by: teacherNameInput.value || 'Unknown'
      })
    });
    const data = await res.json();
    if (res.ok) {
      overlay.classList.remove('show');
      successCheck.classList.add('show');
      vibrate([40, 60, 40]);
      setTimeout(() => {
        successCheck.classList.remove('show');
        showToast(`${currentStudent.student_name} recorded`);
      }, 620);
    } else {
      showToast(data.error || 'Failed to record', true);
    }
  } catch (e) {
    showToast('Network error — could not send', true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-check"></i>&nbsp; Verified';
    closeOverlay();
  }
});

// ---------- High-speed scanner setup ----------
const formatsToSupport = [
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.EAN_8,
  Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,
  Html5QrcodeSupportedFormats.QR_CODE
];

const html5QrCode = new Html5Qrcode("reader", {
  formatsToSupport,
  verbose: false,
  useBarCodeDetectorIfSupported: true
});

const config = {
  fps: 20,
  qrbox: { width: 280, height: 160 },
  aspectRatio: 1.777778,
  disableFlip: false,
  experimentalFeatures: { useBarCodeDetectorIfSupported: true }
};

function onScanFailure() {}

Html5Qrcode.getCameras().then(cameras => {
  if (!cameras || !cameras.length) {
    showError('No camera found on this device');
    return;
  }
  const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    onScanFailure
  ).catch(() => {
    html5QrCode.start(backCam.id, config, onScanSuccess, onScanFailure)
      .catch(err => showError('Camera start failed: ' + err));
  });
}).catch(err => {
  showError('Camera permission denied or unavailable');
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    lastCode = null;
  }
});
</script>
</body>
</html>
